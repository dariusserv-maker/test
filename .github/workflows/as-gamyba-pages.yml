name: AS gamyba preview
on:
  push:
    branches: [as-gamyba-preview]
    paths:
      - 'as-gamyba/**'
      - '.github/workflows/as-gamyba-pages.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: as-gamyba-pages
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build static preview
        working-directory: as-gamyba
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: npm run build
      - name: Publish generated files to gh-pages
        working-directory: as-gamyba
        run: node scripts/publish-pages.mjs
